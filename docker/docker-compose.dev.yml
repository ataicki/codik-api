services:
  pg:
    image: postgres:18.1-alpine
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}' ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    container_name: api
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://postgres:asdfjkl@pg:5432/nestjs?schema=public
    ports:
      - '5000:5000'
    depends_on:
      pg:
        condition: service_healthy

volumes:
  postgres_data: